{% extends "catalog/base.html" %}
{% block title %}Снять товар с публикации{% endblock %}

{% block content %}
  <h1>Снять с публикации?</h1>
  <p>Вы уверены, что хотите скрыть товар «<strong>{{ object.name }}</strong>»
     с витрины? Его всегда можно опубликовать снова в админ-панели.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-warning">Снять с публикации</button>
    <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
      Отмена
    </a>
  </form>
{% endblock %}
