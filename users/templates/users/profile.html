{% extends "catalog/base.html" %}
{% block title %}Мой профиль{% endblock %}

{% block content %}
  <h1>Мой профиль</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>
{% endblock %}
