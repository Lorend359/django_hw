{% extends "catalog/base.html" %}
{% block content %}
  <h1>Контакты</h1>
  {% if contacts %}
    <ul class="list-group">
      {% for c in contacts %}
        <li class="list-group-item">
          <strong>{{ c.name }}:</strong> {{ c.value }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Контактная информация отсутствует.</p>
  {% endif %}
{% endblock %}
